name: solo48-endgrain
services:
  endgrain:
    build: .
    image: solo48-endgrain:1.0
    network_mode: bridge
    ports:
      - "127.0.0.1:${ENDGRAIN_PORT:-18948}:8000"
    volumes:
      - inspections:/var/lib/endgrain
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200"]
      interval: 4s
      timeout: 5s
      retries: 8
volumes:
  inspections:
